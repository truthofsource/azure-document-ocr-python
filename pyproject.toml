[project]
name = "azure-document-ocr-python"
version = "0.1.0"
requires-python = ">=3.11"
description = "Selected-page Azure document OCR with saved operation recovery"
[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocr_project*"]
