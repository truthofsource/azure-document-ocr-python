<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2240" viewBox="0 0 1400 2240" role="img" aria-labelledby="title desc"><title id="title">Azure Document OCR — Document Processing Pipeline</title><desc id="desc">Approved scans → validated, searchable text for the platform.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#586574" /></marker></defs><rect width="1400" height="2240" fill="white" /><g font-family="Arial,Helvetica,sans-serif"><g data-layer="connections"><path d="M700.0,336 L700.0,370.0 L700.0,370.0 L700.0,404" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M700.0,574 L700.0,608.0 L700.0,608.0 L700.0,642" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M700.0,1050 L700.0,1084.0 L700.0,1084.0 L700.0,1118" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M700.0,1288 L700.0,1322.0 L700.0,1322.0 L700.0,1356" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M700.0,1526 L700.0,1560.0 L700.0,1560.0 L700.0,1594" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M700.0,1764 L700.0,1798.0 L700.0,1798.0 L700.0,1832" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M700.0,812 L700.0,846.0 L700.0,846.0 L700.0,880" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5" /><path d="M525,727 L460,727 L460,1679 L525,1679" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5" /><path d="M875,1203 L990,1203" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5" /><path d="M875,1441 L1165,1441 L1165,1288" fill="none" stroke="#586574" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5" /></g><text x="54" y="36" font-size="12" fill="#617084" font-weight="700">PLATFORM ARCHITECTURE · ILLUSTRATED OVERVIEW</text><text x="54" y="79" font-size="30" fill="#172d46" font-weight="700">Azure Document OCR — Document Processing Pipeline</text><text x="54" y="110" font-size="16" fill="#526276">Approved scans → validated, searchable text for the platform.</text><g data-node="prerequisites"><rect x="54" y="166" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="211.0" y="178" data-purpose-icon="prerequisites"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z" /></g></svg><text x="229.0" y="238" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">Platform prerequisites</text><text x="229.0" y="266" font-size="14" fill="#40556b" text-anchor="middle">Documents UI + Entra staff permissions.</text><text x="229.0" y="284" font-size="14" fill="#40556b" text-anchor="middle">Private Blob + trusted Defender proof.</text><text x="229.0" y="302" font-size="14" fill="#40556b" text-anchor="middle">Managed identity + Hub private paths.</text></g><g data-node="source"><rect x="525" y="166" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="178" data-purpose-icon="source"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h10l5 5v15H5V2Zm10 0v6h5M8 12h9m-9 4h9m-9 4h5" /></g></svg><text x="700.0" y="238" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">1. Approved, clean source</text><text x="700.0" y="266" font-size="14" fill="#40556b" text-anchor="middle">Private Blob; exact version + clean proof.</text><text x="700.0" y="284" font-size="14" fill="#40556b" text-anchor="middle">Saved audience and OCR processing choice.</text></g><g data-node="worker"><rect x="525" y="404" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="416" data-purpose-icon="worker"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 1 3h4l1-3 3 2-1 3 2 3 3-1v5l-3 1-2 3 1 3-3 2-1-3h-4l-1 3-3-2 1-3-2-3-3-1V9l3 1 2-3-1-3 3-2Z" /><path d="m10 8 6 4-6 4V8Z" /></g></svg><text x="700.0" y="476" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">2. Azure Functions index worker</text><text x="700.0" y="504" font-size="14" fill="#40556b" text-anchor="middle">Claim SQL job; check lease and source.</text><text x="700.0" y="522" font-size="14" fill="#40556b" text-anchor="middle">Five-minute timer or Admin action.</text></g><g data-node="native"><rect x="525" y="642" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="654" data-purpose-icon="native"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 5-5 7 5 7m10-14 5 7-5 7m-3-16-4 20" /></g></svg><text x="700.0" y="714" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">3. Extract existing text first</text><text x="700.0" y="742" font-size="14" fill="#40556b" text-anchor="middle">Read supported native document text.</text><text x="700.0" y="760" font-size="14" fill="#40556b" text-anchor="middle">Consider OCR only for scanned pages.</text></g><g data-node="admission"><rect x="525" y="880" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="892" data-purpose-icon="admission"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="5" rx="7" ry="3" /><path d="M2 5v10c0 4 14 4 14 0V5M2 10c0 4 14 4 14 0" /><path d="M18 9c5 0 5 6 0 6m0 0c5 0 5 6 0 6H9" /></g></svg><text x="700.0" y="952" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">4. Processing admission</text><text x="700.0" y="980" font-size="14" fill="#40556b" text-anchor="middle">Verify readiness + global/source consent.</text><text x="700.0" y="998" font-size="14" fill="#40556b" text-anchor="middle">Reserve estimated usage in Azure SQL.</text></g><g data-node="ocr"><rect x="525" y="1118" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="1130" data-purpose-icon="ocr"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 7 3v5c0 4-7 8-7 8S2 14 2 10V5l7-3Z" /><circle cx="17" cy="16" r="4" /><path d="m20 19 3 3" /></g></svg><text x="700.0" y="1190" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">5. Azure Document Intelligence</text><text x="700.0" y="1218" font-size="14" fill="#40556b" text-anchor="middle">Managed identity; send whole file once.</text><text x="700.0" y="1236" font-size="14" fill="#40556b" text-anchor="middle">Read only the selected scanned pages.</text></g><g data-node="receipt"><rect x="525" y="1356" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="1368" data-purpose-icon="receipt"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="1" /><path d="M7 7h.1M10 7h7M7 12h.1m3 0h7M7 17h.1m3 0h7" /></g></svg><text x="700.0" y="1428" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">6. Receipt and status polling</text><text x="700.0" y="1456" font-size="14" fill="#40556b" text-anchor="middle">Save the operation reference in SQL.</text><text x="700.0" y="1474" font-size="14" fill="#40556b" text-anchor="middle">GET polls use that same Azure operation.</text></g><g data-node="publish"><rect x="525" y="1594" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="1606" data-purpose-icon="publish"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z" /><path d="m7 12 3 3 7-7" /></g></svg><text x="700.0" y="1666" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">7. Validate and publish</text><text x="700.0" y="1694" font-size="14" fill="#40556b" text-anchor="middle">Validate pages; merge native/OCR text.</text><text x="700.0" y="1712" font-size="14" fill="#40556b" text-anchor="middle">Recheck source, policy and current lease.</text><text x="700.0" y="1730" font-size="14" fill="#40556b" text-anchor="middle">Publish atomic Azure SQL passages.</text></g><g data-node="handoff"><rect x="425" y="1832" width="550" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="682.0" y="1844" data-purpose-icon="handoff"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0" /></g></svg><text x="700.0" y="1904" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">Searchable passages available to RAG</text><text x="700.0" y="1932" font-size="14" fill="#40556b" text-anchor="middle">Retained page references and source revisions.</text><text x="700.0" y="1950" font-size="14" fill="#40556b" text-anchor="middle">Retrieval and answer generation are a separate pipeline.</text></g><g data-node="uncertain"><rect x="990" y="1118" width="350" height="170" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" /><svg width="36" height="36" viewBox="0 0 40 40" x="1147.0" y="1130" data-purpose-icon="uncertain"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 11 20H1L12 2Z" /><path d="M12 8v6m0 4h.1" /></g></svg><text x="1165.0" y="1190" font-size="16" fill="#20384f" font-weight="700" text-anchor="middle">Uncertain result → operator review</text><text x="1165.0" y="1218" font-size="14" fill="#40556b" text-anchor="middle">Keep the original receipt and usage hold.</text><text x="1165.0" y="1236" font-size="14" fill="#40556b" text-anchor="middle">Reconcile provider and lease evidence.</text><text x="1165.0" y="1254" font-size="14" fill="#40556b" text-anchor="middle">Do not create a replacement paid request.</text></g><text x="825" y="850" font-size="12" fill="#526276" text-anchor="middle">If needed + permitted</text><text x="310" y="1667" font-size="12" fill="#526276" text-anchor="middle">Usable local text: no OCR</text><text x="932" y="1191" font-size="12" fill="#526276" text-anchor="middle">Unknown</text><text x="1060" y="1429" font-size="12" fill="#526276" text-anchor="middle">Unconfirmed receipt / status</text><path d="M54 2060 H1346" stroke="#d7e0ea" stroke-width="1" /><text x="54" y="2080" font-size="13" fill="#526276">OCR prepares text for search; the original Blob/PDF is retained unchanged. No new searchable-PDF layer is created.</text><text x="54" y="2103" font-size="13" fill="#526276">Selected-page processing still transfers the whole approved file. Without OCR, only readable local text contributes to indexing.</text><text x="54" y="2126" font-size="13" fill="#526276">A saved receipt does not automatically resume work after a restart. Preserve uncertain operations; do not submit a second paid POST.</text><text x="54" y="2149" font-size="13" fill="#526276">Feature flags, source settings and service readiness control execution. This is a pipeline view, not a live health check.</text></g></svg>
